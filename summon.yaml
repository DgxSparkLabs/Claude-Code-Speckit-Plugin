name: speckit
description: Provides slash-command skills to install, run, upgrade, and manage GitHub Spec Kit (spec-driven development) via the `specify` CLI.
system_requirements:
  - name: uv
    optional: false
    reason: "Installs and runs specify-cli from PyPI"
  - name: git
    optional: true
    reason: "Enables branch creation, auto-commit hooks, and feature branch validation; without git, features are tracked by directory naming only"
  - name: jq
    optional: true
    reason: "Used for safe JSON construction in shell scripts; a pure-bash fallback is included when jq is unavailable"
