name: Plugin Compat Check
description: >-
  Register this repository's marketplace with the Claude CLI, install the
  plugin, assert the plugin and every installable skill are present, and
  validate the manifest. Fails the job if the plugin no longer registers,
  installs, lists, or validates, or if a skills/*/SKILL.md skill is missing
  from the installed plugin path.

inputs:
  claude-version:
    description: "Claude Code CLI version to install."
    default: "latest"
    required: false

runs:
  using: composite
  steps:
    - name: Install Claude Code CLI
      shell: bash
      run: |
        # Official installer (Windows/PowerShell equivalent: powershell irm https://claude.ai/install.ps1 | iex)
        curl -fsSL https://claude.ai/install.sh | bash -s -- "${{ inputs.claude-version }}"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"
        claude --version

    - name: Derive marketplace and plugin identity
      id: id
      shell: bash
      run: |
        MP=$(jq -r '.name' .claude-plugin/marketplace.json)
        PLUGIN=$(jq -r '.plugins[0].name' .claude-plugin/marketplace.json)
        echo "marketplace=$MP" >> "$GITHUB_OUTPUT"
        echo "plugin=$PLUGIN" >> "$GITHUB_OUTPUT"
        echo "Marketplace: $MP  Plugin: $PLUGIN"

    - name: Register marketplace
      shell: bash
      run: claude plugin marketplace add ./

    - name: Assert marketplace is listed
      shell: bash
      run: claude plugin marketplace list | grep -F "${{ steps.id.outputs.marketplace }}"

    - name: Install the plugin
      shell: bash
      run: claude plugin install ${{ steps.id.outputs.plugin }}@${{ steps.id.outputs.marketplace }} --scope project

    - name: Assert plugin is listed
      shell: bash
      run: claude plugin list | grep -F "${{ steps.id.outputs.plugin }}"

    - name: Install uv
      uses: astral-sh/setup-uv@v10

    - name: Assert every plugin skill is present after install
      shell: bash
      env:
        PLUGIN_ID: "${{ steps.id.outputs.plugin }}@${{ steps.id.outputs.marketplace }}"
      run: |
        set -euo pipefail
        echo "Enumerated installable skills (skills/*/SKILL.md):"
        uv run scripts/list_skills.py

        echo "=== claude plugin list --json ==="
        claude plugin list --json || true

        PLUGIN_HOME="${CLAUDE_CONFIG_DIR:-$HOME/.claude}/plugins"
        echo "=== ${PLUGIN_HOME}/installed_plugins.json ==="
        if [ -f "${PLUGIN_HOME}/installed_plugins.json" ]; then
          cat "${PLUGIN_HOME}/installed_plugins.json"
        else
          echo "(missing)"
        fi
        echo "=== SKILL.md under ${PLUGIN_HOME} ==="
        find "${PLUGIN_HOME}" -name SKILL.md -print 2>/dev/null || true

        # Claude Code has no `claude skills` / `claude plugin skills` subcommand
        # (https://code.claude.com/docs/en/cli-reference). Plugin skills are
        # discovered from <plugin>/skills/<name>/SKILL.md once the marketplace
        # plugin is copied into ~/.claude/plugins/cache
        # (https://code.claude.com/docs/en/plugins-reference#plugin-caching-and-file-resolution,
        #  https://code.claude.com/docs/en/skills#where-skills-live).
        uv run scripts/assert_skills.py \
          --expected-from-repo . \
          --plugin-id "${PLUGIN_ID}" \
          --installed-root "${PLUGIN_HOME}"

    - name: Validate marketplace (fails non-zero on real errors)
      shell: bash
      run: claude plugin validate ./

    - name: Cleanup
      if: always()
      shell: bash
      run: |
        claude plugin uninstall ${{ steps.id.outputs.plugin }} --scope project || true
        claude plugin prune --scope project -y || true
        claude plugin marketplace remove ${{ steps.id.outputs.marketplace }} || true
