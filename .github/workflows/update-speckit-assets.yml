# update-speckit-assets.yml — keep the snapshot aligned with PyPI specify-cli
#
# Installs the latest stable specify-cli from PyPI (the same channel the init
# skill uses). If the installed CLI version differs from plugin.json,
# regenerates assets/bash/, syncs skills/init, bumps plugin.json to the
# installed CLI version, and opens a PR.
#
# A push to assets/skills/init/extensions.txt, or workflow_dispatch with
# force_regenerate, re-runs generation even when the version is unchanged
# so the snapshot's .specify/extensions.yml cannot silently drift.

name: Update Spec Kit Assets

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths:
      - "assets/skills/init/extensions.txt"
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: "Regenerate assets even when the installed CLI version matches plugin.json"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6

      # ── Read current plugin version ───────────────────────────────
      - name: Get current plugin version
        id: current
        run: |
          VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current plugin version: $VERSION"

      # ── Install uv ───────────────────────────────────────────────
      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: false

      # ── Install specify-cli from PyPI (latest stable) ─────────────
      - name: Install specify-cli
        id: cli
        run: |
          uv tool install specify-cli --force
          echo "Installed specify-cli:"
          specify version
          uv run scripts/update_assets.py parse-version

      # ── Compare versions / decide whether to regenerate ───────────
      - name: Check if update is needed
        id: check
        run: >
          uv run scripts/update_assets.py decide
          --cli "${{ steps.cli.outputs.version }}"
          --current "${{ steps.current.outputs.version }}"
          --force "${{ github.event.inputs.force_regenerate }}"
          --event "${{ github.event_name }}"

      # ── Regenerate assets ─────────────────────────────────────────
      - name: Regenerate assets
        if: steps.check.outputs.regen == 'true'
        run: uv run scripts/update_assets.py regenerate

      # ── Sync skills/ from assets/skills/* ─────────────────────────
      # scripts/build_skills.py syncs every authored skill from
      # assets/skills/* into skills/.
      - name: Rebuild bundled skills
        if: steps.check.outputs.regen == 'true'
        run: uv run scripts/build_skills.py

      # ── Update plugin.json version ────────────────────────────────
      - name: Update plugin.json version
        if: steps.check.outputs.needs_update == 'true'
        run: uv run scripts/update_assets.py bump-version --version "${{ steps.cli.outputs.version }}"

      # ── Regenerate README ─────────────────────────────────────────
      - name: Regenerate README
        if: steps.check.outputs.regen == 'true'
        run: uv run scripts/generate_readme.py

      # ── Create Pull Request ───────────────────────────────────────
      - name: Create Pull Request
        id: cpr
        if: steps.check.outputs.regen == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # PAT with contents:write + pull-requests:write. Falls back to
          # GITHUB_TOKEN, but note: if the org disables "Allow GitHub Actions
          # to create and approve pull requests", only a PAT can open the PR.
          token: ${{ secrets.SPECKIT_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "chore: update spec-kit assets to ${{ steps.cli.outputs.version }}"
          branch: "auto/update-speckit-${{ steps.cli.outputs.version }}"
          title: "chore: update spec-kit assets to ${{ steps.cli.outputs.version }}"
          body: |
            Automated snapshot refresh from PyPI **specify-cli ${{ steps.cli.outputs.version }}**.

            **Channel:** PyPI `specify-cli` (latest stable), same as the init skill. Version taken from the installed CLI (`specify --version`), not a GitHub release tag.

            Changes:
            - Regenerated `assets/bash/` via `specify init` from specify-cli ${{ steps.cli.outputs.version }}
            - Synced `skills/` from `assets/skills/*` via `scripts/build_skills.py`
            - Bumped `.claude-plugin/plugin.json` when the installed CLI version differed from the plugin
            - Regenerated `README.md` via `scripts/generate_readme.py`
          labels: dependencies,automated
          delete-branch: true

      # ── Verify the regenerated plugin, then gate the merge ────────
      # Runs the same compat check as compat-test.yml against the assets just
      # committed to the PR branch. It runs AFTER Create Pull Request on
      # purpose: `claude plugin install --scope project` writes local config
      # (.claude/settings.local.json) into the checkout, and create-pull-request
      # stages untracked files, so running it earlier would leak those artifacts
      # into the PR. A failure fails the job and skips auto-merge, leaving the
      # PR open for inspection.
      - name: Plugin compat check
        if: steps.check.outputs.regen == 'true'
        uses: ./.github/actions/plugin-compat

      # ── Enable auto-merge ─────────────────────────────────────────
      # The in-job "Plugin compat check" above already verified this asset set,
      # so merging a clean (conflict-free) PR is safe. `--auto` is used when a
      # PAT opened the PR and required checks apply; otherwise GitHub rejects
      # `--auto` on an already-clean PR, so fall back to a direct merge. Neither
      # path merges a PR that has conflicts.
      - name: Enable auto-merge
        if: steps.check.outputs.regen == 'true' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.SPECKIT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --auto --merge \
            || gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --merge
