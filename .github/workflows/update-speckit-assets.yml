# update-speckit-assets.yml — daily check for new spec-kit releases
#
# Checks the latest release at github/spec-kit. If it's newer than the
# current plugin version, regenerates assets/ and bumps plugin.json to
# match, then opens a PR.

name: Update Spec Kit Assets

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6

      # ── Detect latest spec-kit release ────────────────────────────
      - name: Get latest spec-kit release version
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh api repos/github/spec-kit/releases/latest --jq '.tag_name')
          VERSION="${TAG#v}"
          # Skip dev/pre-release versions (e.g. 0.5.2.dev0, 0.6.0a1, 0.6.0rc1)
          if [[ "$VERSION" =~ (dev|alpha|beta|rc) ]]; then
            echo "Skipping pre-release version: $VERSION"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest spec-kit release: $TAG ($VERSION)"

      # ── Read current plugin version ───────────────────────────────
      - name: Get current plugin version
        id: current
        run: |
          VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current plugin version: $VERSION"

      # ── Compare versions ──────────────────────────────────────────
      - name: Check if update is needed
        id: check
        run: |
          LATEST="${{ steps.latest.outputs.version }}"
          CURRENT="${{ steps.current.outputs.version }}"
          if [ -z "$LATEST" ]; then
            echo "No stable release found. Skipping."
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          elif [ "$LATEST" = "$CURRENT" ]; then
            echo "Version $CURRENT is already up to date."
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "Update available: $CURRENT → $LATEST"
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      # ── Install uv ───────────────────────────────────────────────
      - name: Install uv
        if: steps.check.outputs.needs_update == 'true'
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: false

      # ── Install specify-cli at the release tag ────────────────────
      - name: Install specify-cli
        if: steps.check.outputs.needs_update == 'true'
        run: |
          uv tool install specify-cli --force \
            --from "git+https://github.com/github/spec-kit.git@${{ steps.latest.outputs.tag }}"
          echo "Installed specify-cli version:"
          specify version

      # ── Regenerate assets ─────────────────────────────────────────
      - name: Regenerate assets
        if: steps.check.outputs.needs_update == 'true'
        run: |
          INIT_FLAGS=(--integration claude --here --force --ignore-agent-tools --non-interactive)

          EXT_FLAGS=()
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            [[ -z "$line" || "${line:0:1}" == "#" ]] && continue
            EXT_FLAGS+=(--extension "$line")
          done < speckit-extensions.txt

          TARGET_DIR="assets/bash"
          echo "═══ Generating bash assets (--script sh) ═══"

          WORK_DIR="$(mktemp -d)"

          (cd "$WORK_DIR" && specify init . "${INIT_FLAGS[@]}" "${EXT_FLAGS[@]}" --script sh)

          rm -rf "$TARGET_DIR"
          mkdir -p "$TARGET_DIR"
          cp -R "$WORK_DIR/.claude" "$TARGET_DIR/.claude"
          cp -R "$WORK_DIR/.specify" "$TARGET_DIR/.specify"
          find "$TARGET_DIR/.specify" -name '*.sh' -exec chmod +x {} + 2>/dev/null || true

          rm -rf "$WORK_DIR"
          echo "✅  assets/bash updated"

      # ── Sync bundled plugin skills from assets ────────────────────
      - name: Sync bundled skills
        if: steps.check.outputs.needs_update == 'true'
        run: |
          set -euo pipefail
          rm -rf skills/speckit-*
          mkdir -p skills
          cp -R assets/bash/.claude/skills/speckit-* skills/
          echo "Synced skills/speckit-* from assets/bash/.claude/skills/"

      # ── Update plugin.json version ────────────────────────────────
      - name: Update plugin.json version
        if: steps.check.outputs.needs_update == 'true'
        run: |
          PLUGIN_JSON=".claude-plugin/plugin.json"
          NEW_VERSION="${{ steps.latest.outputs.version }}"
          jq --arg v "$NEW_VERSION" '.version = $v' "$PLUGIN_JSON" > "${PLUGIN_JSON}.tmp"
          mv "${PLUGIN_JSON}.tmp" "$PLUGIN_JSON"
          echo "Updated plugin.json version to $NEW_VERSION"

      # ── Regenerate README ─────────────────────────────────────────
      - name: Regenerate README
        if: steps.check.outputs.needs_update == 'true'
        run: uv run scripts/generate_readme.py

      # ── Create Pull Request ───────────────────────────────────────
      - name: Create Pull Request
        id: cpr
        if: steps.check.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # PAT with contents:write + pull-requests:write. Falls back to
          # GITHUB_TOKEN, but note: if the org disables "Allow GitHub Actions
          # to create and approve pull requests", only a PAT can open the PR.
          token: ${{ secrets.SPECKIT_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "chore: update spec-kit assets to ${{ steps.latest.outputs.version }}"
          branch: "auto/update-speckit-${{ steps.latest.outputs.version }}"
          title: "chore: update spec-kit assets to ${{ steps.latest.outputs.version }}"
          body: |
            Automated update of spec-kit assets to version **${{ steps.latest.outputs.version }}**.

            **Release:** https://github.com/github/spec-kit/releases/tag/${{ steps.latest.outputs.tag }}

            Changes:
            - Regenerated `assets/bash/` from spec-kit ${{ steps.latest.outputs.version }}
            - Synced `skills/speckit-*` from `assets/bash/.claude/skills/`
            - Updated `.claude-plugin/plugin.json` version to `${{ steps.latest.outputs.version }}`
            - Regenerated `README.md` via `scripts/generate_readme.py`
          labels: dependencies,automated
          delete-branch: true

      # ── Verify the regenerated plugin, then gate the merge ────────
      # Runs the same compat check as compat-test.yml against the assets just
      # committed to the PR branch. It runs AFTER Create Pull Request on
      # purpose: `claude plugin install --scope project` writes local config
      # (.claude/settings.local.json) into the checkout, and create-pull-request
      # stages untracked files, so running it earlier would leak those artifacts
      # into the PR. A failure fails the job and skips auto-merge, leaving the
      # PR open for inspection.
      - name: Plugin compat check
        if: steps.check.outputs.needs_update == 'true'
        uses: ./.github/actions/plugin-compat

      # ── Enable auto-merge ─────────────────────────────────────────
      # The in-job "Plugin compat check" above already verified this asset set,
      # so merging a clean (conflict-free) PR is safe. `--auto` is used when a
      # PAT opened the PR and required checks apply; otherwise GitHub rejects
      # `--auto` on an already-clean PR, so fall back to a direct merge. Neither
      # path merges a PR that has conflicts.
      - name: Enable auto-merge
        if: steps.check.outputs.needs_update == 'true' && steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.SPECKIT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --auto --merge \
            || gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --merge
