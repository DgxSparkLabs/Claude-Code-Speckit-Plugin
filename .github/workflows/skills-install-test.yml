# skills-install-test.yml — prove installable skills are listable via `npx skills`
# and that the init wrapper sequence (specify init + extension add) works.
#
# Job agent-skills: top-level skills/*/SKILL.md via the vercel-labs `npx skills`
# CLI (the plugin ships the authored set under skills/), plus no-network snapshot guards.
# Job wrapper-smoke: install specify-cli from PyPI and run the wrapper sequence.

name: Skills Install Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  agent-skills:
    name: npx skills list+install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Assert skills/ matches the authored skill set in assets/skills/*
        run: uv run scripts/assert_bundled_skills.py

      - name: Assert snapshot extensions match extensions.txt
        run: uv run scripts/assert_extensions.py

      - name: Smoke-test skill enumerator and assertions
        run: uv run tests/test_list_skills.py

      - name: Enumerate installable skills
        run: |
          set -euo pipefail
          uv run scripts/list_skills.py
          uv run scripts/list_skills.py --json

      - name: Assert npx skills add . --list includes every skill
        env:
          CI: "true"
        run: |
          set -euo pipefail
          npx --yes skills@latest add . --list | tee "$RUNNER_TEMP/skills-available.txt"
          uv run scripts/assert_skills.py \
            --expected-from-repo . \
            --listing "$RUNNER_TEMP/skills-available.txt"

      - name: Install every enumerated skill for Claude Code
        env:
          CI: "true"
        run: |
          set -euo pipefail
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            echo "::group::npx skills add . --skill ${name} -a claude-code -y"
            npx --yes skills@latest add . --skill "$name" -a claude-code -y </dev/null
            echo "::endgroup::"
          done < <(uv run scripts/list_skills.py)

          echo "=== npx skills list ==="
          npx --yes skills@latest list | tee "$RUNNER_TEMP/skills-installed.txt"
          echo "=== .claude/skills tree ==="
          find .claude/skills -print 2>/dev/null || true

          uv run scripts/assert_skills.py \
            --expected-from-repo . \
            --listing "$RUNNER_TEMP/skills-installed.txt" \
            --installed-root .claude

  wrapper-smoke:
    name: specify init + extension add smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install specify-cli from PyPI
        run: uv tool install specify-cli

      - name: Run wrapper sequence and assert output
        run: |
          set -euo pipefail

          EXT_FILE="assets/skills/init/extensions.txt"
          if [ ! -f "$EXT_FILE" ]; then
            echo "::error::Missing $EXT_FILE"
            exit 1
          fi

          expected_count=0
          expected_names=()
          for d in assets/bash/.claude/skills/speckit-*/; do
            [ -d "$d" ] || continue
            expected_count=$((expected_count + 1))
            expected_names+=("$(basename "$d")")
          done
          if [ "$expected_count" -lt 1 ]; then
            echo "ERROR: no speckit-* skills under assets/bash/.claude/skills/" >&2
            exit 1
          fi

          WORK="$(mktemp -d)"
          (
            cd "$WORK"
            specify init . --integration claude --script sh --non-interactive --ignore-agent-tools --force
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line#"${line%%[![:space:]]*}"}"
              line="${line%"${line##*[![:space:]]}"}"
              [[ -z "$line" || "${line:0:1}" == "#" ]] && continue
              specify extension add "$line"
            done < "$GITHUB_WORKSPACE/$EXT_FILE"
          )

          if [ ! -d "$WORK/.specify" ]; then
            echo "ERROR: wrapper sequence did not create .specify/" >&2
            exit 1
          fi

          live_count=0
          for d in "$WORK"/.claude/skills/speckit-*/; do
            [ -d "$d" ] || continue
            live_count=$((live_count + 1))
          done
          if [ ! -d "$WORK/.claude/skills" ] || [ "$live_count" -lt 1 ]; then
            echo "ERROR: .claude/skills/ is empty (expected at least one speckit-* skill)" >&2
            ls -la "$WORK/.claude/skills" >&2 || true
            exit 1
          fi

          missing_names=()
          for name in "${expected_names[@]}"; do
            if [ ! -f "$WORK/.claude/skills/$name/SKILL.md" ]; then
              missing_names+=("$name")
            fi
          done
          if [ "${#missing_names[@]}" -ne 0 ]; then
            echo "::warning::snapshot names absent from live specify init: ${missing_names[*]}"
            echo "=== $WORK/.claude/skills ===" >&2
            ls -la "$WORK/.claude/skills" >&2 || true
          fi
          echo "ok: .specify/ present and $live_count speckit-* skills installed"

          uv run scripts/assert_extensions.py \
            --extensions-txt "$GITHUB_WORKSPACE/$EXT_FILE" \
            --extensions-yml "$WORK/.specify/extensions.yml" \
            --skills-dir "$WORK/.claude/skills"
