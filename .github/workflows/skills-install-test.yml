# skills-install-test.yml — prove installable skills are listable via `npx skills`
# and that /speckit:init behaves correctly in standalone and plugin modes.
#
# Job agent-skills: top-level skills/*/SKILL.md via the vercel-labs `npx skills` CLI.
# Job speckit-init: layout-based detection plus --skills/--no-skills overrides.

name: Skills Install Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  agent-skills:
    name: npx skills list+install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Assert bundled skills match assets/bash/.claude/skills/
        run: uv run scripts/assert_bundled_skills.py

      - name: Smoke-test skill enumerator and assertions
        run: uv run tests/test_list_skills.py

      - name: Enumerate installable skills
        run: |
          set -euo pipefail
          uv run scripts/list_skills.py
          uv run scripts/list_skills.py --json

      - name: Assert npx skills add . --list includes every skill
        env:
          CI: "true"
        run: |
          set -euo pipefail
          npx --yes skills@latest add . --list | tee "$RUNNER_TEMP/skills-available.txt"
          uv run scripts/assert_skills.py \
            --expected-from-repo . \
            --listing "$RUNNER_TEMP/skills-available.txt"

      - name: Install every enumerated skill for Claude Code
        env:
          CI: "true"
        run: |
          set -euo pipefail
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            echo "::group::npx skills add . --skill ${name} -a claude-code -y"
            npx --yes skills@latest add . --skill "$name" -a claude-code -y </dev/null
            echo "::endgroup::"
          done < <(uv run scripts/list_skills.py)

          echo "=== npx skills list ==="
          npx --yes skills@latest list | tee "$RUNNER_TEMP/skills-installed.txt"
          echo "=== .claude/skills tree ==="
          find .claude/skills -print 2>/dev/null || true

          uv run scripts/assert_skills.py \
            --expected-from-repo . \
            --listing "$RUNNER_TEMP/skills-installed.txt" \
            --installed-root .claude

  speckit-init:
    name: /speckit:init layout detection and overrides
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Layout detection and --skills/--no-skills overrides
        run: |
          set -euo pipefail
          shopt -s nullglob

          expected_count=0
          for d in assets/bash/.claude/skills/speckit-*/; do
            expected_count=$((expected_count + 1))
          done
          if [ "$expected_count" -lt 1 ]; then
            echo "ERROR: no speckit-* skills were found under assets/bash/.claude/skills/" >&2
            exit 1
          fi

          assert_specify() {
            local proj="$1" label="$2"
            if [ ! -d "$proj/.specify" ]; then
              echo "ERROR: $label did not create .specify/" >&2
              exit 1
            fi
          }

          assert_skills_copied() {
            local proj="$1" label="$2"
            local name
            for d in assets/bash/.claude/skills/speckit-*/; do
              name="$(basename "$d")"
              cmp "$proj/.claude/skills/$name/SKILL.md" "$d/SKILL.md"
            done
            echo "$label: .specify/ present and all $expected_count speckit-* skills copied"
          }

          assert_skills_absent() {
            local proj="$1" label="$2"
            local extras
            extras="$(find "$proj/.claude/skills" -maxdepth 1 -name 'speckit-*' 2>/dev/null || true)"
            if [ -n "$extras" ]; then
              echo "ERROR: $label copied speckit-* skills:" >&2
              echo "$extras" >&2
              exit 1
            fi
            echo "$label: .specify/ present and no speckit-* skills copied"
          }

          # (a) STANDALONE via layout: stage the skill so its ../../ has NO
          # plugin.json, mimicking an npx install. CLAUDE_PLUGIN_ROOT is set
          # ONLY to resolve assets; detection must still be standalone.
          proj="$(mktemp -d)"
          stage="$(mktemp -d)"
          mkdir -p "$stage/.claude/skills"
          cp -R skills/init "$stage/.claude/skills/init"
          ( cd "$proj" && CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE" bash "$stage/.claude/skills/init/scripts/init-speckit.sh" ) 2>&1 | tee "$RUNNER_TEMP/init-standalone.log"
          if grep -q "Bundled assets not found locally" "$RUNNER_TEMP/init-standalone.log"; then
            echo "ERROR: standalone layout fell back to cloning instead of using CLAUDE_PLUGIN_ROOT for assets" >&2
            exit 1
          fi
          assert_specify "$proj" "standalone layout"
          assert_skills_copied "$proj" "standalone layout"

          # (b) PLUGIN via layout: run the repo script directly.
          # $SKILL_DIR/../../ is $GITHUB_WORKSPACE, which HAS plugin.json.
          proj="$(mktemp -d)"
          ( cd "$proj" && bash "$GITHUB_WORKSPACE/skills/init/scripts/init-speckit.sh" ) 2>&1 | tee "$RUNNER_TEMP/init-plugin.log"
          if grep -q "Bundled assets not found locally" "$RUNNER_TEMP/init-plugin.log"; then
            echo "ERROR: init-speckit.sh fell back to cloning upstream instead of using the PR checkout" >&2
            exit 1
          fi
          assert_specify "$proj" "plugin layout"
          assert_skills_absent "$proj" "plugin layout"

          # (c) OVERRIDE --no-skills in the standalone layout.
          proj="$(mktemp -d)"
          stage="$(mktemp -d)"
          mkdir -p "$stage/.claude/skills"
          cp -R skills/init "$stage/.claude/skills/init"
          ( cd "$proj" && CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE" bash "$stage/.claude/skills/init/scripts/init-speckit.sh" --no-skills ) 2>&1 | tee "$RUNNER_TEMP/init-no-skills.log"
          assert_specify "$proj" "standalone --no-skills"
          assert_skills_absent "$proj" "standalone --no-skills"

          # (d) OVERRIDE --skills in the plugin layout.
          proj="$(mktemp -d)"
          ( cd "$proj" && bash "$GITHUB_WORKSPACE/skills/init/scripts/init-speckit.sh" --skills ) 2>&1 | tee "$RUNNER_TEMP/init-skills.log"
          if grep -q "Bundled assets not found locally" "$RUNNER_TEMP/init-skills.log"; then
            echo "ERROR: --skills plugin layout fell back to cloning upstream instead of using the PR checkout" >&2
            exit 1
          fi
          assert_specify "$proj" "plugin --skills"
          assert_skills_copied "$proj" "plugin --skills"
