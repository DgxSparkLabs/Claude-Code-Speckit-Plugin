# skills-install-test.yml — prove installable skills are listable via `npx skills`
# and that the init wrapper sequence (specify init + extension add) works.
#
# Job agent-skills: top-level skills/*/SKILL.md via the vercel-labs `npx skills`
# CLI (the plugin ships the authored set under skills/), plus no-network snapshot guards.
# Job wrapper-smoke: install specify-cli from PyPI and run the wrapper sequence.

name: Skills Install Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  agent-skills:
    name: npx skills list+install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Assert skills/ matches the authored skill set in assets/skills/*
        run: uv run scripts/assert_bundled_skills.py

      - name: Assert snapshot extensions match extensions.txt
        run: uv run scripts/assert_extensions.py

      - name: Smoke-test skill enumerator and assertions
        run: uv run pytest

      - name: Enumerate installable skills
        run: |
          set -euo pipefail
          uv run scripts/list_skills.py
          uv run scripts/list_skills.py --json

      - name: Assert npx skills add . --list includes every skill
        env:
          CI: "true"
        run: |
          set -euo pipefail
          npx --yes skills@latest add . --list | tee "$RUNNER_TEMP/skills-available.txt"
          uv run scripts/assert_skills.py \
            --expected-from-repo . \
            --listing "$RUNNER_TEMP/skills-available.txt"

      - name: Install every enumerated skill for Claude Code
        env:
          CI: "true"
        run: uv run scripts/install_skills_smoke.py

  wrapper-smoke:
    name: specify init + extension add smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Install specify-cli from PyPI
        run: uv tool install specify-cli

      - name: Run wrapper sequence and assert output
        run: uv run scripts/wrapper_smoke.py
