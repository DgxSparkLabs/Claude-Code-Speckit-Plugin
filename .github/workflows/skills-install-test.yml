# skills-install-test.yml — prove installable skills are listable via `npx skills`
# and that /speckit:init behaves correctly in standalone and plugin modes.
#
# Job agent-skills: top-level skills/*/SKILL.md via the vercel-labs `npx skills` CLI.
# Job speckit-init: standalone copies speckit-* skills; plugin mode copies only .specify/.

name: Skills Install Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  agent-skills:
    name: npx skills list+install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Assert bundled skills match assets/bash/.claude/skills/
        run: uv run scripts/assert_bundled_skills.py

      - name: Smoke-test skill enumerator and assertions
        run: uv run tests/test_list_skills.py

      - name: Enumerate installable skills
        run: |
          set -euo pipefail
          uv run scripts/list_skills.py
          uv run scripts/list_skills.py --json

      - name: Assert npx skills add . --list includes every skill
        env:
          CI: "true"
        run: |
          set -euo pipefail
          npx --yes skills@latest add . --list | tee "$RUNNER_TEMP/skills-available.txt"
          uv run scripts/assert_skills.py \
            --expected-from-repo . \
            --listing "$RUNNER_TEMP/skills-available.txt"

      - name: Install every enumerated skill for Claude Code
        env:
          CI: "true"
        run: |
          set -euo pipefail
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            echo "::group::npx skills add . --skill ${name} -a claude-code -y"
            npx --yes skills@latest add . --skill "$name" -a claude-code -y </dev/null
            echo "::endgroup::"
          done < <(uv run scripts/list_skills.py)

          echo "=== npx skills list ==="
          npx --yes skills@latest list | tee "$RUNNER_TEMP/skills-installed.txt"
          echo "=== .claude/skills tree ==="
          find .claude/skills -print 2>/dev/null || true

          uv run scripts/assert_skills.py \
            --expected-from-repo . \
            --listing "$RUNNER_TEMP/skills-installed.txt" \
            --installed-root .claude

  speckit-init:
    name: /speckit:init standalone and plugin modes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Standalone init copies .specify/ and every bundled skill
        run: |
          set -euo pipefail
          uv run scripts/list_skills.py --root assets/bash/.claude
          uv run scripts/list_skills.py --root assets/bash/.claude --json > "$RUNNER_TEMP/speckit-expected.json"

          proj="$(mktemp -d)"
          ( cd "$proj" && bash "$GITHUB_WORKSPACE/skills/init/scripts/init-speckit.sh" ) 2>&1 | tee "$RUNNER_TEMP/init-standalone.log"
          if grep -q "Bundled assets not found locally" "$RUNNER_TEMP/init-standalone.log"; then
            echo "ERROR: init-speckit.sh fell back to cloning upstream instead of using the PR checkout" >&2
            exit 1
          fi
          if [ ! -d "$proj/.specify" ]; then
            echo "ERROR: standalone init did not create .specify/" >&2
            exit 1
          fi

          for d in assets/bash/.claude/skills/*/; do
            name="$(basename "$d")"
            cmp "$proj/.claude/skills/$name/SKILL.md" "$d/SKILL.md"
          done

          if ! uv run scripts/assert_skills.py \
            --expected-json "$RUNNER_TEMP/speckit-expected.json" \
            --installed-root "$proj/.claude"; then
            echo "=== $proj/.claude/skills tree ===" >&2
            find "$proj/.claude/skills" -print 2>/dev/null || true
            exit 1
          fi
          echo "standalone init: .specify/ present and all speckit-* skills copied"

      - name: Plugin-mode init copies .specify/ and skips skills
        run: |
          set -euo pipefail
          proj="$(mktemp -d)"
          ( cd "$proj" && CLAUDE_PLUGIN_ROOT="$GITHUB_WORKSPACE" bash "$GITHUB_WORKSPACE/skills/init/scripts/init-speckit.sh" ) 2>&1 | tee "$RUNNER_TEMP/init-plugin.log"
          if [ ! -d "$proj/.specify" ]; then
            echo "ERROR: plugin-mode init did not create .specify/" >&2
            exit 1
          fi
          extras="$(find "$proj/.claude/skills" -maxdepth 1 -name 'speckit-*' 2>/dev/null || true)"
          if [ -n "$extras" ]; then
            echo "ERROR: plugin-mode init copied speckit-* skills; the plugin already provides them:" >&2
            echo "$extras" >&2
            exit 1
          fi
          echo "plugin-mode init: .specify/ present and no speckit-* skills copied"
