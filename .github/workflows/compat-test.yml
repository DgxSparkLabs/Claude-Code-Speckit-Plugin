# compat-test.yml — verify the plugin registers, installs, and lists cleanly
#
# Modeled on the DgxSparkLabs/marketplace-template compat suite: it drives the
# real Claude Code CLI against this repository's marketplace so a broken
# manifest or missing skill surfaces as a red check on the PR.

name: Compat Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/plugin-compat
